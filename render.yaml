services:
  - type: web
    name: advisor
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HOST
        value: 0.0.0.0
      - key: ANTHROPIC_API_KEY
        sync: false   # you type this in the Render dashboard
