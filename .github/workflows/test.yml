name: test

on:
  # Pop (pop/) is a separate Python app; its changes do not need the advisor tests
  push:
    paths-ignore: ['pop/**']
  pull_request:
    paths-ignore: ['pop/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build:data
      - run: git diff --exit-code data/
      - run: npm test
